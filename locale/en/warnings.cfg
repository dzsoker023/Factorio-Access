[fa]
# Warning messages (NOT UI navigation)
# For UI strings, see ui-warnings.cfg

# Warning types (sorted by proximity)
warning-type-no-fuel=No fuel
warning-type-no-minable-resources=No minable resources
warning-type-no-power=No power
warning-type-no-recipe=No recipe
warning-type-not-connected=Not connected to power
warning-type-lightning-hole=Gap in lightning protection
warning-type-lightning-shore-gap=Unprotected shore
warning-type-lightning-unprotected-building=Unprotected building

# Fulgora lightning-attractor coverage gaps (see lightning-zones.lua and the
# changelog). "Hole" = fully enclosed by protection, reported at the middle
# of the gap. "Shore gap" = uncovered land touching the island's edge,
# reported with a compass direction relative to the island. "Unprotected
# building" (warning-type-lightning-unprotected-building above) is a real
# placed entity, not one of these synthetic gap entries - it renders with the
# building's own name and position like any other warning, no extra label
# key needed here.
lightning-hole-label=gap in coverage
lightning-shore-gap-label=uncovered shore to the __1__
